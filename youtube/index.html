<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore curated YouTube videos, channels, durations, and view statistics powered by FreeAPI." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Crect width='64' height='64' rx='16' fill='%23dc2626'/%3E%3Cpath d='M26 20l18 12-18 12V20z' fill='white'/%3E%3C/svg%3E" />
  <title>FreeAPI YouTube — Video Feed &amp; Discovery</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'media'
    };
  </script>
</head>
<body class="min-h-screen flex flex-col font-sans bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-red-600 selection:text-white">
  <noscript>
    <div class="p-4 bg-red-600 text-white text-center text-sm font-semibold">
      JavaScript is required to use FreeAPI YouTube.
    </div>
  </noscript>

  <header class="sticky top-0 z-30 backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-2xl bg-red-600 text-white flex items-center justify-center font-bold shadow-sm shrink-0" aria-hidden="true">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
          </svg>
        </div>
        <div class="min-w-0">
          <h1 class="text-lg sm:text-xl font-bold tracking-tight truncate">FreeAPI YouTube</h1>
          <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 truncate">Explore curated videos, channels, and statistics</p>
        </div>
      </div>

      <!-- Search bar -->
      <div class="w-full sm:w-80 relative">
        <label for="search-input" class="sr-only">Search videos by title or channel</label>
        <input
          id="search-input"
          type="search"
          placeholder="Search title or channel..."
          class="w-full pl-10 pr-9 py-2 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-100/70 dark:bg-slate-800/70 text-sm focus:bg-white dark:focus:bg-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500 transition-colors"
        />
        <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
    </div>
  </header>

  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <div id="status-live" aria-live="polite" class="sr-only"></div>
    <div id="app"></div>
  </main>

  <footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-6 text-center text-xs sm:text-sm text-slate-500 dark:text-slate-400">
    <div class="max-w-7xl mx-auto px-4">
      Built with FreeAPI
    </div>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
