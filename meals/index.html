<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse global meal recipes, ingredients, categories, cuisine areas, and step-by-step instructions powered by FreeAPI." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Crect width='64' height='64' rx='16' fill='%23059669'/%3E%3Cpath d='M16 34h32c0 9-7 16-16 16s-16-7-16-16z' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M24 26v-6M32 26v-8M40 26v-6' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>FreeAPI Meals — Global Recipe Explorer</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'media'
    };
  </script>
</head>
<body class="min-h-screen flex flex-col font-sans bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-emerald-600 selection:text-white">
  <noscript>
    <div class="p-4 bg-emerald-600 text-white text-center text-sm font-semibold">
      JavaScript is required to use FreeAPI Meals.
    </div>
  </noscript>

  <header class="sticky top-0 z-30 backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-2xl bg-emerald-600 text-white flex items-center justify-center font-bold shadow-sm shrink-0" aria-hidden="true">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        </div>
        <div class="min-w-0">
          <h1 class="text-lg sm:text-xl font-bold tracking-tight truncate">FreeAPI Meals</h1>
          <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 truncate">Browse world recipes, ingredients, and step-by-step instructions</p>
        </div>
      </div>

      <!-- Search, Category, and Area Filters -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 w-full lg:w-auto lg:min-w-[540px]">
        <div class="relative">
          <label for="search-input" class="sr-only">Search meals by name</label>
          <input
            id="search-input"
            type="search"
            placeholder="Search meal name..."
            class="w-full pl-9 pr-3 py-2 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-100/70 dark:bg-slate-800/70 text-sm focus:bg-white dark:focus:bg-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500"
          />
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>

        <div>
          <label for="category-select" class="sr-only">Filter by category</label>
          <select
            id="category-select"
            class="w-full px-3 py-2 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-100/70 dark:bg-slate-800/70 text-sm focus:bg-white dark:focus:bg-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500"
          >
            <option value="all">All Categories</option>
          </select>
        </div>

        <div>
          <label for="area-select" class="sr-only">Filter by cuisine area</label>
          <select
            id="area-select"
            class="w-full px-3 py-2 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-100/70 dark:bg-slate-800/70 text-sm focus:bg-white dark:focus:bg-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500"
          >
            <option value="all">All Areas</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <div id="status-live" aria-live="polite" class="sr-only"></div>
    <div id="app"></div>
  </main>

  <dialog
    id="meal-modal"
    aria-labelledby="modal-meal-title"
    class="m-auto w-full max-w-3xl rounded-2xl bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-800 p-0 shadow-2xl backdrop:bg-slate-950/60 backdrop:backdrop-blur-xs"
  >
    <div id="modal-body" class="p-5 sm:p-8 max-h-[88vh] overflow-y-auto"></div>
  </dialog>

  <footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-6 text-center text-xs sm:text-sm text-slate-500 dark:text-slate-400">
    <div class="max-w-7xl mx-auto px-4">
      Built with FreeAPI
    </div>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
